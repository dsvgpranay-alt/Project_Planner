<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container py-5">
    <div class="text-center mb-5">
        <p class="text text-muted small mb-2">DevPath Planner</p>
        <h1 class="display-5 fw-semibold">
            Tell us about your <span class="highlight">idea.</span>
        </h1>
        <p class="text-muted mt-3">
            Give us a few details about your project and we'll turn it into a clear development path.
        </p>
    </div>

    <div class="form-container mx-auto">
        <form action="/generate" method="POST">

            <div class="mb-4">
                <label for="project_name" class="form-label">Project name</label>
                <input type="text" class="form-control form-control-lg" id="project_name" name="project_name" placeholder="e.g. Campus Marketplace" required>
            </div>

            <div class="mb-4">
                <label for="project_idea" class="form-label">What do you want to build?</label>
                <textarea class="form-control" id="project_idea" name="project_idea" rows="5" placeholder="Describe your idea, what problem it solves, and how you imagine it working..." required></textarea>
                <div class="form-text">Don't worry about technical details. Just explain the idea in your own words.</div>
            </div>

            <div class="mb-4">
                <label for="project_type" class="form-label">What type of project is this?</label>
                <select class="form-select form-select-lg" id="project_type" name="project_type" required>
                    <option value="" selected disabled>Select a type</option>
                    <option value="web">Web Application</option>
                    <option value="mobile">Mobile Application</option>
                    <option value="desktop">Desktop Application</option>
                    <option value="ai">AI / Machine Learning</option>
                    <option value="iot">IoT / Hardware</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="mb-4">
                <label for="technologies" class="form-label">Technologies you know ?</label>
                <input type="text" class="form-control form-control-lg" id="technologies" name="technologies" placeholder="e.g. Python, Flask, HTML, CSS, MySQL">
                <div class="form-text">Leave this empty if you're starting from scratch.</div>
            </div>
            <div class="mb-4">
                <label for="time" class="form-label">How much time can you spend?</label>
                <select class="form-select form-select-lg" id="time" name="time" required>
                    <option value="" selected disabled>Select your timeframe</option>
                    <option value="few-days">A few days</option>
                    <option value="1-2-weeks">1–2 weeks</option>
                    <option value="1-month">About a month</option>
                    <option value="2-3-months">2–3 months</option>
                    <option value="flexible">No fixed deadline</option>
                </select>
            </div>
            <div class="mb-5">
                <label for="goal" class="form-label">What's your main goal?</label>
                <select class="form-select form-select-lg" id="goal" name="goal" required>
                    <option value="" selected disabled>Choose your goal</option>
                    <option value="learning">Learn while building</option>
                    <option value="portfolio">Build a portfolio project</option>
                    <option value="hackathon">Prepare for a hackathon</option>
                    <option value="startup">Build a real product</option>
                    <option value="academic">Academic / college project</option>
                    <option value="experiment">Just experiment and explore</option>
                </select>
            </div>
            <a type="submit" class="btn btn-devpath btn-lg w-100">
                Generate My Path →
            </a>

        </form>
    </div>
</div>
</body>
</html>
